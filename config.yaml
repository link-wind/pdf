formula_parser:
  confidence_threshold: 0.7
  enable_latex_validation: true
  engine: pp_formulanet
  max_formula_height: 1000
  max_formula_width: 1500
  model_size: L
  # 大模型配置
  use_llm: false                   # 是否使用大模型解析公式
  llm_priority: false              # 是否优先使用大模型（设为false表示传统方法优先）
  llm_fallback: false              # 当传统方法失败时是否使用大模型作为后备
  llm_api_key: "sk-576e3801be4b445eb944b3dd79fa6f9c"

pix2text_processor:
  enabled: true
  use_gpu: true
  device: cuda
  layout:
    scores_thresh: 0.45
  text_formula:
    languages:
      - en
      # - ch_sim
    
    # ONNX Runtime配置 - 禁用TensorRT
    onnx_providers:
      # - TensorrtExecutionProvider
      - CUDAExecutionProvider
      # - CPUExecutionProvider
    disable_tensorrt: False
    
    # 文本识别配置
    text:
      rec_model_name: "doc-densenet_lite_136-gru"
      rec_model_backend: "pytorch"
      # rec_model_fp: "C:\\Users\\28601\\AppData\\Roaming\\cnocr\\2.3\\doc-densenet_lite_136-gru"

ocr_processor:
  confidence_threshold: 0.75
  engine: paddleocr
  language: en
  use_gpu: true
  ocr_version: PP-OCRv5

layout_analyzer:
  # 模型配置
  model_path: "doclayout.pt"        # DocLayout模型权重文件路径
  model_type: "doclayout"           # 模型类型
  
  # 推理配置
  confidence_threshold: 0.45         # 置信度阈值
  iou_threshold: 0.45              # IoU阈值用于NMS
  use_gpu: true                  # 是否使用GPU
  batch_size: 1                    # 批处理大小
  max_det: 300                     # 最大检测数量
  input_size: 1280                 # 输入图像尺寸
  
  # 后处理配置
  min_region_area: 50.0            # 最小区域面积
  
  # 可视化配置
  visualization_enabled: false      # 启用可视化
  show_confidence: true           # 显示置信度
  show_class_names: true          # 显示类别名称
  bbox_thickness: 1               # 边界框粗细
  
md_generator:
  formula_format: latex
  image_format: png
  include_metadata: true
  include_page_breaks: true
  line_break_style: double
  max_line_length: 80
  preserve_formatting: false
  table_format: markdown
  # LLM标题优化配置
  enable_llm_title_optimization: True  # 是否启用LLM标题优化
  llm_title_threshold: 2               # 启用LLM优化的最小标题数量

# LLM配置
llm:
  api_key: "sk-8be39e7cd0314b8db1ea6595ba740f17"                          # API密钥，请填入您的密钥
  base_url: "https://api.deepseek.com" # API基础URL，支持OpenAI和DeepSeek
  model: "deepseek-chat"               # 模型名称，支持gpt-3.5-turbo、gpt-4、deepseek-chat等
  temperature: 0.7                     # 温度参数
  max_tokens: 4096                     # 最大token数
  timeout: 30                          # 超时时间（秒）
  max_retries: 3                       # 最大重试次数
  enabled: True                      # 是否启用LLM功能
  provider: "deepseek"                 # LLM提供商：openai、deepseek
  
pdf_converter:
  dpi: 300
  format: PNG
  poppler_path: null
  quality: 95
  single_thread: true
  use_cairo: true
reading_order:
  algorithm: layoutreader
  batch_size: 2
  column_detection: true
  confidence_threshold: 0.4
  layout_reader_model_path: hantian/layoutreader
  max_sequence_length: 1024
table_parser:
  # RapidTable配置
  engine: rapid_table             # 表格解析引擎
  model_type: SLANETPLUS          # RapidTable模型类型 (SLANETPLUS, UNITABLE)
  confidence_threshold: 0.6
  use_gpu: true
  gpu_id: 0                       # GPU设备ID
  # 大模型配置
  use_llm: false                   # 是否使用大模型解析表格
  llm_priority: true              # 是否优先使用大模型（设为true表示优先使用大模型）
  llm_fallback: true              # 当传统方法失败时是否使用大模型作为后备
  llm_api_key: "sk-576e3801be4b445eb944b3dd79fa6f9c"  # 大模型API密钥
